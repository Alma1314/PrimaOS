[package]
name = "prima-user"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "prima-smoke"
path = "src/main.rs"
test = false
bench = false

# SPEC-093：第二个服务端点的独立二进制映像（`BETA` 端点）。
[[bin]]
name = "prima-beta"
path = "src/beta.rs"
test = false
bench = false

# SPEC-103：ring3 服务管理器的独立二进制映像（服务机制的收敛目标）。
[[bin]]
name = "prima-servicemgr"
path = "src/servicemgr.rs"
test = false
bench = false

# SPEC-106（S4-D3）：三个基础服务端点的独立二进制映像（日志 / Namespace / 基础存储）。
[[bin]]
name = "prima-log"
path = "src/log.rs"
test = false
bench = false

[[bin]]
name = "prima-ns"
path = "src/ns.rs"
test = false
bench = false

[[bin]]
name = "prima-store"
path = "src/store.rs"
test = false
bench = false

# SPEC-114（S4-D4）：第一个 ring3 用户态驱动（持 `Device(IOPortRange)` cap 走受控端口路径）。
[[bin]]
name = "prima-driver"
path = "src/driver.rs"
test = false
bench = false

# 阶段 5 片 C：用户态 tty 字节流服务（把 C 的 write(1/2) 落到串口）。
[[bin]]
name = "prima-tty"
path = "src/tty.rs"
test = false
bench = false

[dependencies]
prima-runtime = { path = "../prima-runtime" }
prima-ostd = { path = "../prima-ostd" }
