name: Bounded acceptance

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: host
            packages: clang llvm lld make gcc libc6-dev binutils
            fetch_depth: 1
            rust_cache: true
          - group: lint
            packages: ''
            fetch_depth: 1
            rust_cache: true
          - group: docs
            packages: ''
            fetch_depth: 0
            rust_cache: false
          - group: bios
            packages: clang llvm lld make gcc libc6-dev binutils qemu-system-x86 busybox-static
            fetch_depth: 1
            rust_cache: true
            libos_cache: true
          - group: linux
            packages: clang llvm lld make gcc libc6-dev binutils qemu-system-x86 busybox-static
            fetch_depth: 1
            rust_cache: true
            libos_cache: true
            linux_cache: true
          - group: gate
            packages: clang llvm lld make gcc libc6-dev binutils qemu-system-x86
            fetch_depth: 1
            rust_cache: true
            libos_cache: true
          - group: gate-audit
            packages: clang llvm lld make gcc libc6-dev binutils qemu-system-x86
            fetch_depth: 1
            rust_cache: true
            libos_cache: true
          - group: domains
            packages: clang llvm lld make gcc libc6-dev binutils qemu-system-x86
            fetch_depth: 1
            rust_cache: true
            libos_cache: true
          - group: formal
            packages: elan
            fetch_depth: 1
            rust_cache: false
            formal_cache: true
    env:
      CARGO_BUILD_JOBS: '2'
      PRIMA_MUSL_JOBS: '2'
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: ${{ matrix.fetch_depth }}
          persist-credentials: false
      - name: Install host tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ matrix.packages }}
      - name: Cache Rust toolchain and registry
        if: matrix.rust_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup
          key: prima-rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            prima-rust-${{ runner.os }}-
      - name: Cache musl/sbase inputs and sysroot
        if: matrix.libos_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            target/musl-1.2.5
            target/musl-prefix
            target/sbase
          key: prima-libos-${{ runner.os }}-${{ hashFiles('scripts/ci-inputs.lock.json', 'docs/superpowers/compat/musl-snapshot.lock.toml', 'libos/linux/musl/build.py', 'libos/linux/musl/build.sh', 'libos/linux/musl/patches/**') }}
      - name: Cache Linux reference inputs
        if: matrix.linux_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            target/ci-inputs/busybox.deb
            target/ci-inputs/busybox
            target/linux-ref
          key: prima-linux-${{ runner.os }}-${{ hashFiles('scripts/ci-inputs.lock.json') }}
      - name: Cache formal tools and Lean cache
        if: matrix.formal_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target/ci-inputs/aeneas.tar.gz
            target/aeneas
          key: prima-formal-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci-inputs.lock.json', 'lean/refinement/toolchain.lock.json', 'lean/refinement/lake-manifest.json') }}
      - name: Resolve documentation comparison base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "PRIMA_CI_BASE=$BASE_SHA" >> "$GITHUB_ENV"
      - name: Prepare locked inputs and run group
        run: python3 scripts/ci.py '${{ matrix.group }}' --prepare --require-clean
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/
          if-no-files-found: warn
          retention-days: 7
