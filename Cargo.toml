[workspace]
resolver = "3"
members = ["kernel", "prima-abi", "prima-ostd", "prima-runtime", "prima-user", "libos/linux", "libos/windows", "prima-initgen", "xtask", "cosir"]
default-members = ["xtask"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.dev.package.prima-user]
debug = false
# M13a：共享用户态服务代码增长后，debug（-O0）构建把 log/ns/store 推到 29 页，
# 与 boot manifest 的单段上限冲突。只对用户态 crate 启用轻量优化，内核不改。
opt-level = 1

[profile.dev.package.prima-runtime]
debug = false
opt-level = 1

# Linux/Windows personality 与 prima-user 同样只做轻量优化，保持既有用户态页数预算。
[profile.dev.package.prima-linux]
debug = false
opt-level = 1

[profile.dev.package.prima-windows]
debug = false
opt-level = 1
