[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[features]
gate-audit-probe = ["kernel/gate-audit-probe"]
gate-probe = ["kernel/gate-probe"]
gs-probe = ["kernel/gs-probe"]
smp-ap = ["kernel/smp-ap"]
smp-probe = ["kernel/smp-probe"]
gs3-probe = ["kernel/gs3-probe"]
linux-probe = ["prima-linux/linux-probe"]
windows-pe-probe = ["prima-user/windows-pe-probe"]
libos-bench = ["linux-probe", "prima-linux/libos-bench", "kernel/timestamp-probe"]

[dependencies]
prima-abi = { path = "../prima-abi" }
prima-initgen = { path = "../prima-initgen" }
prima-runtime = { path = "../prima-runtime" }
bootloader = "=0.11.17"
llvm-tools = "=0.1.1"
prima-user = { path = "../prima-user", artifact = "bin", lib = true, target = "x86_64-unknown-none" }
prima-linux = { path = "../libos/linux", artifact = "bin", lib = true, target = "x86_64-unknown-none" }
kernel = { path = "../kernel", artifact = "bin", target = "x86_64-unknown-none" }
