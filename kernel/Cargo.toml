[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[features]
# Explicitly opt-in fault injection; absent from ordinary kernel images.
gate-audit-probe = []
gate-probe = []
# GS-1：受控 ring3 用户 GS 探针镜像；替换用户程序、开启 syscall swapgs，绝不出现在默认镜像。
gs-probe = []
smp-ap = ["smp-probe"]
smp-probe = []
# GS-3：每 CPU GS 区与经 `%gs` 的 CPU 索引；隐含 smp-ap，绝不出现在默认镜像。
gs3-probe = ["smp-ap"]
# P5-4-1: isolated CPL0 directed IPI round trip, no scheduler/shootdown.
ipi-probe = ["gs3-probe"]
# P5-3b-1：CPL0 `int 0x80`/#PF 现场按 CPU 分区探针；隐含 gs3-probe，绝不出现在默认镜像。
entry-percpu-probe = ["gs3-probe", "prima-ostd/entry-percpu-probe"]
# P5-3b-3：每 CPU 可运行队列、创建时放置与真实双核负载；隐含入口分区，绝不出现在默认镜像。
sched-percpu-probe = ["entry-percpu-probe"]
timestamp-probe = []

[lib]
name = "kernel"
path = "src/lib.rs"

[[bin]]
name = "prima-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bootloader_api = "=0.11.17"
prima-abi = { path = "../prima-abi" }
prima-ostd = { path = "../prima-ostd" }
