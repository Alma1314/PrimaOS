[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Explicitly opt-in fault injection; absent from ordinary kernel images.
gate-audit-probe = []

[lib]
name = "kernel"
path = "src/lib.rs"

[[bin]]
name = "prima-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bootloader_api = "=0.11.17"
prima-abi = { path = "../prima-abi" }
prima-ostd = { path = "../prima-ostd" }
