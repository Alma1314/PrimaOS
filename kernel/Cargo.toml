[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[features]
# Explicitly opt-in fault injection; absent from ordinary kernel images.
gate-audit-probe = []
gate-probe = []
# GS-1：受控 ring3 用户 GS 探针镜像；替换用户程序、开启 syscall swapgs，绝不出现在默认镜像。
gs-probe = []
smp-ap = ["smp-probe"]
smp-probe = []
timestamp-probe = []

[lib]
name = "kernel"
path = "src/lib.rs"

[[bin]]
name = "prima-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bootloader_api = "=0.11.17"
prima-abi = { path = "../prima-abi" }
prima-ostd = { path = "../prima-ostd" }
